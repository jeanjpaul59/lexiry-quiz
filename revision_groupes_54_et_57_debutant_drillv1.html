<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Révision Groupes 54 et 57 - Drill</title>
<style>
body{font-family:Arial,sans-serif;margin:24px;background:#f7f7f7;color:#222}
.wrap{max-width:900px;margin:0 auto}
h1{margin-bottom:6px}.subtitle{color:#666;margin-bottom:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar button{padding:11px 15px;font-size:15px;cursor:pointer}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.counter{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;text-align:center}
.counter small{display:block;color:#666;margin-bottom:4px}.counter strong{font-size:24px}
.stage{background:#fff;border:1px solid #ddd;border-radius:14px;padding:28px;min-height:390px;display:flex;flex-direction:column;justify-content:center}
.card{perspective:1200px;height:250px;cursor:pointer;user-select:none}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.front{background:#fff;border:2px solid #d9d9d9}.back{background:#eef4ff;border:2px solid #c7d7f2;transform:rotateY(180deg)}
.question,.answer{font-size:clamp(30px,4vw,46px);font-weight:bold;line-height:1.25}.answer{color:#003366}
.note{margin-top:14px;color:#1f4e79;font-size:18px}.result{margin-top:14px;font-size:18px;font-weight:bold}.known{color:#0a7a20}.missed{color:#b00020}
.timer-wrap{margin-top:22px}.timer-row{display:flex;justify-content:space-between;color:#666;font-size:14px;margin-bottom:7px}
.timer-track{height:12px;background:#e5e5e5;border-radius:999px;overflow:hidden}.timer-bar{height:100%;width:100%;background:#666;transition:width .05s linear}
.instruction{text-align:center;color:#666;margin-top:16px;min-height:24px}.center{text-align:center;padding:40px 20px}
@media(max-width:700px){body{margin:12px}.counters{grid-template-columns:1fr 1fr}.stage{padding:16px}.card{height:230px}}
</style></head><body>
<div class='wrap'>
<h1>Révision Groupes 54 et 57</h1>
<div class='subtitle'>FR-RU — Drill</div>
<div class='toolbar'>
<button id='btnPause' onclick='togglePause()'>Pause</button>
<button onclick='shufflePending()'>Mélanger les mots restants</button>
<button onclick='resetProgress()'>Réinitialiser la progression</button>
</div>
<div class='counters'>
<div class='counter'><small>Acquis</small><strong id='known'>0</strong></div>
<div class='counter'><small>Restants</small><strong id='remaining'>0</strong></div>
<div class='counter'><small>À revoir</small><strong id='misses'>0</strong></div>
<div class='counter'><small>Présentations</small><strong id='attempts'>0</strong></div>
</div><div class='stage' id='stage'></div></div>
<script>
const quizId=66;
const storageKey='lexiry_drill_'+quizId;
const items=[
      {id:2140, q:"ralentir", a:"замедлять / замедлить", note:"v.,imp/perf — le réchauffement climatique"},
      {id:2141, q:"développer", a:"развивать / развить", note:"v.,imp/perf — les énergies renouvelables"},
      {id:2142, q:"varié", a:"разнообразный", note:"adj. — en parlant du climat"},
      {id:2143, q:"variation de température", a:"перепад температуры", note:"expr. — brusque"},
      {id:2144, q:"changeant", a:"переменчивый", note:"adj. — en parlant de la météo"},
      {id:2145, q:"pergélisol", a:"вечная мерзлота", note:"expr."},
      {id:2146, q:"se propager", a:"распространяться", note:"v.,imp — en parlant du feu"},
      {id:2147, q:"détruire", a:"уничтожить", note:"v.,perf — par le feu"},
      {id:2148, q:"lutter contre le feu", a:"бороться с огнём", note:"expr."},
      {id:2149, q:"larguer de l’eau", a:"сбрасывать воду", note:"expr. — sur une forêt en feu"},
      {id:2150, q:"une forêt en feu", a:"горящий лес", note:"expr."},
      {id:2151, q:"gaz à effet de serre", a:"парниковые газы", note:"expr."},
      {id:2152, q:"inondation", a:"наводнение", note:"n."},
      {id:2153, q:"glacier", a:"ледник", note:"n."},
      {id:2154, q:"émissions", a:"выбросы", note:"n. — de gaz à effet de serre"},
      {id:2155, q:"déchets", a:"отходы", note:"n."},
      {id:2156, q:"contribution", a:"вклад", note:"n. — apporter sa contribution"},
      {id:2157, q:"influencer", a:"влиять (на)", note:"v.,imp — sur l’humeur, la santé, les plans, l’économie"},
      {id:2158, q:"augmenter", a:"повышаться / повыситься", note:"v.,imp/perf — en parlant de la température"},
      {id:2159, q:"être observé", a:"наблюдаться", note:"v.,imp — en parlant de phénomènes climatiques"},
      {id:2160, q:"diminuer", a:"сокращаться / сократиться", note:"v.,imp/perf — quantité de neige et de glaciers"},
      {id:2161, q:"un foyer d’incendie", a:"очаг возгорания", note:"expr."},
      {id:2162, q:"rester / se maintenir", a:"сохраняться", note:"v.,imp — en parlant d’un danger"},
      {id:2163, q:"le changement climatique", a:"изменение климата", note:"expr."}
];
const MIN_MS=2500,MAX_MS=6000,BASE_CHARS=5,EXTRA_MS=220;
const KNOWN_SHOW_MS=1800,MISSED_SHOW_MS=5000;
let data=loadData(),queue=loadQueue(),current=null,phase='idle',timer=null,nextTimer=null,allowedMs=0,elapsedBeforePause=0,runStartedAt=0;
function defaultState(){return{acquired:false,attempts:0,misses:0,lastReactionMs:null};}
function loadData(){let d;try{d=JSON.parse(localStorage.getItem(storageKey)||'null')}catch(e){d=null}if(!d)d={states:{},presentations:0,totalMisses:0,queue:[]};if(!d.states)d.states={};if(!Array.isArray(d.queue))d.queue=[];items.forEach(x=>{if(!d.states[x.id])d.states[x.id]=defaultState()});return d;}
function loadQueue(){const ids=new Set(items.map(x=>x.id));let q=(data.queue||[]).filter(id=>ids.has(id)&&!data.states[id].acquired);const seen=new Set(q);items.forEach(x=>{if(!data.states[x.id].acquired&&!seen.has(x.id))q.push(x.id)});return q;}
function state(x){if(!data.states[x.id])data.states[x.id]=defaultState();return data.states[x.id];}
function save(){data.queue=[...queue];localStorage.setItem(storageKey,JSON.stringify(data));updateCounters();}
function chars(s){return Array.from(String(s||'')).filter(ch=>/[\p{L}\p{N}]/u.test(ch)).length;}
function answerTime(x){return Math.min(MAX_MS,MIN_MS+Math.max(0,chars(x.a)-BASE_CHARS)*EXTRA_MS);}
function elapsed(){return phase==='question'&&runStartedAt?elapsedBeforePause+(performance.now()-runStartedAt):elapsedBeforePause;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function updateCounters(){const k=items.filter(x=>state(x).acquired).length;document.getElementById('known').textContent=k+' / '+items.length;document.getElementById('remaining').textContent=items.length-k;document.getElementById('misses').textContent=data.totalMisses;document.getElementById('attempts').textContent=data.presentations;}
function cardHtml(){return '<div class="card" id="card"><div class="inner"><div class="face front"><div class="question">'+esc(current.q)+'</div>'+(current.note?'<div class="note">['+esc(current.note)+']</div>':'')+'</div><div class="face back"><div class="answer">'+esc(current.a)+'</div><div class="result" id="result"></div></div></div></div><div class="timer-wrap"><div class="timer-row"><span>Temps de réponse</span><span id="timerText"></span></div><div class="timer-track"><div class="timer-bar" id="timerBar"></div></div></div><div class="instruction">Répondez oralement, puis cliquez sur la carte avant la fin du délai.</div>';}
function showQuestion(){clearTimers();if(queue.length===0){done();return}current=items.find(x=>x.id===queue[0]);if(!current){queue.shift();save();showQuestion();return}allowedMs=answerTime(current);elapsedBeforePause=0;runStartedAt=performance.now();phase='question';data.presentations++;state(current).attempts++;save();document.getElementById('stage').innerHTML=cardHtml();document.getElementById('card').addEventListener('click',knownAnswer);startTimer();}
function startTimer(){updateTimer();timer=setInterval(()=>{if(phase!=='question')return;updateTimer();if(elapsed()>=allowedMs)timeoutAnswer()},50);}
function updateTimer(){const e=Math.min(allowedMs,elapsed()),r=Math.max(0,allowedMs-e),p=allowedMs?(r/allowedMs)*100:0;const b=document.getElementById('timerBar'),t=document.getElementById('timerText');if(b)b.style.width=p+'%';if(t)t.textContent=(r/1000).toFixed(1)+' s';}
function knownAnswer(){if(phase!=='question')return;const r=Math.min(allowedMs,elapsed()),s=state(current);s.acquired=true;s.lastReactionMs=Math.round(r);queue.shift();reveal(true,KNOWN_SHOW_MS);save();}
function timeoutAnswer(){if(phase!=='question')return;const s=state(current);s.misses++;data.totalMisses++;const id=queue.shift();queue.push(id);reveal(false,MISSED_SHOW_MS);save();}
function reveal(ok,delay){if(timer){clearInterval(timer);timer=null}phase='reveal';const c=document.getElementById('card');if(c)c.classList.add('flipped');const r=document.getElementById('result');if(r){r.textContent=ok?'Acquis':'À revoir';r.className='result '+(ok?'known':'missed')}const t=document.getElementById('timerText');if(t)t.textContent='';const b=document.getElementById('timerBar');if(b)b.style.width='0%';nextTimer=setTimeout(showQuestion,delay);}
function togglePause(){if(phase==='question')pause();else if(phase==='paused')resume();}
function pause(){if(phase!=='question')return;elapsedBeforePause=elapsed();runStartedAt=0;phase='paused';if(timer){clearInterval(timer);timer=null}document.getElementById('btnPause').textContent='Reprendre';document.getElementById('stage').innerHTML='<div class="center"><h2>Drill en pause</h2><p>La carte est masquée et le chronomètre est arrêté.</p><button onclick="resume()">Reprendre</button></div>';}
function resume(){if(phase!=='paused'||!current)return;phase='question';runStartedAt=performance.now();document.getElementById('btnPause').textContent='Pause';document.getElementById('stage').innerHTML=cardHtml();document.getElementById('card').addEventListener('click',knownAnswer);startTimer();}
function shufflePending(){if(phase==='reveal')return;if(!confirm('Mélanger les mots restant à travailler ?'))return;clearTimers();for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}current=null;phase='idle';document.getElementById('btnPause').textContent='Pause';save();showQuestion();}
function resetProgress(){if(!confirm('Effacer toute la progression du drill et remettre tous les compteurs à zéro ?'))return;clearTimers();localStorage.removeItem(storageKey);data={states:{},presentations:0,totalMisses:0,queue:[]};items.forEach(x=>data.states[x.id]=defaultState());queue=items.map(x=>x.id);current=null;phase='idle';document.getElementById('btnPause').textContent='Pause';save();showQuestion();}
function clearTimers(){if(timer){clearInterval(timer);timer=null}if(nextTimer){clearTimeout(nextTimer);nextTimer=null}}
function done(){clearTimers();phase='done';document.getElementById('btnPause').textContent='Pause';document.getElementById('stage').innerHTML='<div class="center"><h2>Drill terminé</h2><p>Tous les mots ont été acquis.</p><p>Présentations : <strong>'+data.presentations+'</strong> — Réponses hors délai : <strong>'+data.totalMisses+'</strong></p><button onclick="resetProgress()">Recommencer depuis zéro</button></div>';updateCounters();}
updateCounters();save();showQuestion();
</script></body></html>
